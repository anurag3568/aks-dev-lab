<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | AKS DEV LAB</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#02040a] text-cyan-100 font-mono min-h-screen flex items-center justify-center p-4">
    <div class="bg-[#060a14] border border-cyan-500/40 p-8 rounded-3xl max-w-md w-full space-y-6 shadow-[0_0_50px_rgba(6,182,212,0.2)]">
        <div class="text-center space-y-2">
            <div class="inline-block bg-cyan-500/10 text-cyan-400 p-3 rounded-2xl border border-cyan-500/30">
                <i class="fa-solid fa-shield-halved text-2xl"></i>
            </div>
            <h1 class="text-2xl font-black text-white">Owner Portal Login</h1>
            <p class="text-xs text-slate-400">Enter admin credentials to access console.</p>
        </div>
        <form onsubmit="handleAdminLogin(event)" class="space-y-4 font-sans">
            <div>
                <label class="text-xs font-bold text-cyan-400 uppercase tracking-wider block mb-1">Password</label>
                <input type="password" id="admin-pass" autocomplete="off" required placeholder="Enter password (default: admin123)" class="w-full bg-[#02040a] border border-cyan-500/30 text-white px-4 py-3 rounded-xl text-sm font-mono focus:outline-none focus:border-cyan-400">
            </div>
            <button type="submit" class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-black py-3.5 rounded-xl text-xs transition cursor-pointer shadow-lg">
                Authenticate & Enter Console
            </button>
        </form>
        <div class="text-center pt-2">
            <a href="index.html" class="text-xs text-slate-400 hover:text-cyan-300 transition font-sans">← Back to Storefront Index</a>
        </div>
    </div>

    <script>
        function handleAdminLogin(e) {
            e.preventDefault();
            let pass = document.getElementById('admin-pass').value;
            let savedPass = localStorage.getItem('aks_admin_pass') || 'admin123';
            if(pass === savedPass) {
                sessionStorage.setItem('aks_logged_in', 'true');
                window.location.href = 'admin-dashboard.html';
            } else {
                alert('❌ Incorrect Password! Default password is: admin123');
            }
        }
    </script>
</body>
</html>
